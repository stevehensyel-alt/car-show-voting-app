<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#1f4e79" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>Car Show Voting</title>

  <style>
    body { margin:0; font-family: Arial, sans-serif; text-align:center; background:#fff; }
    .header { padding:18px; background:#1f4e79; color:white; font-size:22px; font-weight:800; }
    .wrap { padding:22px; max-width:560px; margin:0 auto; }
    .btn { display:block; width:100%; padding:16px 18px; background:#1f4e79; color:white; border-radius:14px; text-decoration:none; font-size:20px; font-weight:700; border:0; }
    .btn2 { display:block; width:100%; padding:16px 18px; background:#eee; color:#111; border-radius:14px; text-decoration:none; font-size:18px; font-weight:700; border:0; margin-top:12px; }
    .hint { margin-top:16px; color:#333; font-size:14px; line-height:1.35; text-align:left; }
    .pill { display:inline-block; padding:6px 10px; border-radius:999px; background:#f2f2f2; font-size:13px; margin-top:10px; }
  </style>
</head>
<body>
  <div class="header">Car Show Voting</div>

  <div class="wrap">
    <div class="pill" id="platformPill">Loading…</div>

    <a class="btn" id="voteBtn" href="#" rel="noopener">Open Voting</a>

    <!-- Android/Chrome-only install prompt button -->
    <button class="btn2" id="installBtn" style="display:none;">Install App</button>

    <div class="hint" id="instructions">
      <b>iPhone:</b> Open this page in <b>Safari</b> → tap <b>Share</b> → <b>Add to Home Screen</b>.<br><br>
      <b>Android:</b> Tap <b>Install App</b> (if shown) or Chrome menu → <b>Add to Home screen</b>.
    </div>
  </div>

  <script>
    // ✅ Put your current Apps Script web app URL here:
    const VOTING_URL = "PASTE_YOUR_APPS_SCRIPT_URL_HERE";

    document.getElementById("voteBtn").href = VOTING_URL;

    // Detect platform for nicer instructions
    const ua = navigator.userAgent || "";
    const isIOS = /iPhone|iPad|iPod/i.test(ua);
    const isAndroid = /Android/i.test(ua);
    document.getElementById("platformPill").textContent =
      isIOS ? "iPhone / iPad detected" : (isAndroid ? "Android detected" : "Desktop detected");

    // Android install prompt handling
    let deferredPrompt = null;
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const btn = document.getElementById("installBtn");
      btn.style.display = "block";
    });

    document.getElementById("installBtn").addEventListener("click", async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      document.getElementById("installBtn").style.display = "none";
    });

    // Service worker (helps installability on Android)
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js");
    }
  </script>
</body>
</html>
